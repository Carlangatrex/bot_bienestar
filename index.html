<!DOCTYPE html>
<!--
  Acompañante · PWA de acompañamiento emocional
  Versión: 1.0.0 · Año: 2026
  Creado por: Lorena Molano y Carlos Gonzalez
  Descripción: chat que pregunta cómo te sientes y responde con un mensaje de apoyo.
  Licencia: MIT · Repositorio: github.com/Carlangatrex/bot_bienestar
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f62">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Acompañante</title>
<style>
  :root { --bg: #f3f1ec; --bar: #2f6f62; --card: #ffffff; --text: #1f2a27; --muted: #6b7a75; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111715; --bar: #1f4a41; --card: #1e2623; --text: #e8efec; --muted: #8fa19a; }
  }
  * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--bar); color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 12px;
           padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 2px 0 0; font-size: 13px; opacity: .85; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .hbtn { background: rgba(255,255,255,.2); color: #fff; border-radius: 16px; padding: 7px 14px; font-size: 14px; }
  main { flex: 1; width: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 16px; font-size: 16px; line-height: 1.5; }
  .msg.bot { background: var(--card); align-self: flex-start; border-top-left-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.08); border-top: 6px solid var(--c, var(--bar)); }
  .msg.usuario { background: var(--bar); color: #fff; align-self: flex-end; border-top-right-radius: 4px; }
  .emoji { font-size: 24px; margin-right: 8px; }
  .emoji.grande { font-size: 48px; margin: 0 0 8px; display: block; }
  .arquetipos-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 16px; }
  .arquetipo-btn { background: var(--card); border-radius: 16px; padding: 16px; text-align: left; border: 1px solid var(--muted); display: flex; flex-direction: column; gap: 8px; }
  .arquetipo-btn:active { transform: scale(.98); }
  .arq-emoji { font-size: 32px; }
  .arq-label { font-weight: 600; font-size: 17px; }
  .arq-desc { font-size: 13px; color: var(--muted); }
  .actividades { margin-top: 12px; }
  .actividades h3 { margin: 0 0 12px; font-size: 16px; color: var(--muted); text-align: center; }
  .actividades-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actividad-btn { background: var(--card); border-radius: 14px; padding: 14px 12px; border: 1px solid var(--muted); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .actividad-btn:active { transform: scale(.97); }
  .act-emoji { font-size: 28px; }
  .act-label { font-size: 14px; font-weight: 500; text-align: center; }
  .msg .actividades { margin-top: 8px; }
  #input-area { display: flex; gap: 8px; padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--muted); }
  #input { flex: 1; border: 1px solid var(--muted); border-radius: 20px; padding: 10px 16px; font: inherit; background: var(--card); color: var(--text); }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--card); border: 1px solid var(--muted); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .icon-btn:active { opacity: .7; }
  .icon-btn.escuchando { background: var(--bar); color: #fff; border-color: var(--bar); animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  #enviar { background: var(--bar); color: #fff; border-radius: 20px; padding: 0 18px; font-size: 15px; white-space: nowrap; }
  #enviar:active { opacity: .9; }
  dialog { background: var(--card); color: var(--text); border: 0; border-radius: 16px; width: min(420px, 92vw); padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h2 { margin: 0 0 12px; font-size: 18px; }
  dialog a { color: inherit; display: block; padding: 10px 0; }
  dialog .pais { margin-top: 10px; font-weight: 600; }
  dialog .btn { margin-top: 14px; width: auto; padding: 10px 18px; }
  dialog .aviso { margin: 12px 0 0; font-size: 13px; color: var(--muted); }
  dialog .link { margin-top: 4px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div><h1>Acompañante</h1><p>Un mensaje para tu día</p></div>
  <button id="ayudaBtn" class="hbtn" type="button">Ayuda</button>
</header>
<main>
  <div id="chat"></div>
  <div id="input-area">
    <input id="input" type="text" placeholder="Escríbeme cómo te sientes..." autocomplete="off">
    <button id="enviar" type="button">Enviar</button>
    <button id="mic" class="icon-btn" type="button" title="Hablar" style="display:none;">🎤</button>
    <button id="repeat" class="icon-btn" type="button" title="Repetir último mensaje" style="display:none;">🔊</button>
  </div>
</main>
<dialog id="ayuda">
  <h2>Si lo necesitas, hay personas que pueden ayudarte</h2>
  <div id="ayudaLista"></div>
  <p class="aviso">Acompañante no brinda atención médica ni psicológica. Si estás en crisis o en peligro, contacta una línea de ayuda o los servicios de emergencia.</p>
  <a class="link" href="privacidad.html" target="_blank" rel="noopener">Aviso legal y privacidad</a>
  <button class="btn" id="cerrar" type="button">Cerrar</button>
</dialog>
<script src="contenido.js"></script>
<script src="app.js"></script>
<!-- Para ti, que también mereces un poquito de toda la luz que das. -->
</body>
</html>

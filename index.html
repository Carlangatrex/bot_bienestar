<!DOCTYPE html>
<!--
  Acompañante · PWA de acompañamiento emocional
  Versión: 1.0.0 · Año: 2026
  Creado por: Lorena Molano y Carlos Gonzalez
  Descripción: chat que pregunta cómo te sientes y responde con un mensaje de apoyo.
  Licencia: MIT · Repositorio: github.com/Carlangatrex/bot_bienestar
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0084ff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Lorena - Acompañante</title>
<style>
  :root {
    --bg: #ffffff;
    --bar: #ffffff;
    --bubble-in: #e4e6eb;
    --bubble-in-text: #050505;
    --bubble-out: #0084ff;
    --bubble-out-text: #ffffff;
    --text: #050505;
    --muted: #65676b;
    --line: #e4e6eb;
    --input-bg: #f0f2f5;
    --danger: #fa3e3e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18191a;
      --bar: #242526;
      --bubble-in: #3a3b3c;
      --bubble-in-text: #e4e6eb;
      --bubble-out: #0084ff;
      --bubble-out-text: #ffffff;
      --text: #e4e6eb;
      --muted: #b0b3b8;
      --line: #3a3b3c;
      --input-bg: #3a3b3c;
    }
  }
  * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

  /* Barra superior estilo Messenger */
  header {
    background: var(--bar);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
    border-bottom: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
    z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #0084ff, #7b5cff);
    color: #fff; font-weight: 700; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .avatar::after {
    content: ""; position: absolute; right: 0; bottom: 0;
    width: 11px; height: 11px; border-radius: 50%;
    background: #31a24c; border: 2px solid var(--bar);
  }
  .who { min-width: 0; }
  .who h1 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.2; }
  .who p { margin: 1px 0 0; font-size: 12px; color: var(--muted); line-height: 1.2;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  button { font: inherit; color: inherit; border: 0; cursor: pointer; background: none; }
  .round {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    background: var(--input-bg); color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700;
  }
  .round:active { opacity: .7; }

  main { flex: 1; width: 100%; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; min-height: 0; }

  /* Conversación */
  #chat {
    flex: 1; overflow-y: auto; overscroll-behavior: contain;
    padding: 14px 12px 8px;
    display: flex; flex-direction: column; gap: 3px;
  }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

  .msg {
    max-width: 76%; padding: 9px 13px; font-size: 15px; line-height: 1.45;
    border-radius: 18px; word-wrap: break-word;
    animation: pop .16s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.98); } to { opacity: 1; transform: none; } }

  .msg.bot {
    background: var(--bubble-in); color: var(--bubble-in-text);
    align-self: flex-start; border-bottom-left-radius: 5px;
    margin-right: auto;
  }
  .msg.usuario {
    background: var(--bubble-out); color: var(--bubble-out-text);
    align-self: flex-end; border-bottom-right-radius: 5px;
    margin-left: auto;
  }
  .msg + .msg.bot { margin-top: 2px; }
  .msg.bot + .msg.usuario,
  .msg.usuario + .msg.bot { margin-top: 9px; }

  /* Indicador "escribiendo..." */
  .typing { display: flex; align-items: center; gap: 4px; padding: 13px 15px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .45; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* Barra de escritura estilo Messenger */
  #input-area {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 8px 10px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--bar); border-top: 1px solid var(--line);
  }
  .composer {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px;
    background: var(--input-bg); border-radius: 22px; padding: 4px 6px 4px 16px;
  }
  #input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    color: var(--text); font: inherit; font-size: 16px; padding: 8px 0;
  }
  #input::placeholder { color: var(--muted); }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; color: #0084ff;
  }
  .icon-btn:active { opacity: .6; }
  .icon-btn.escuchando { background: var(--danger); color: #fff; animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }

  /* Botón enviar azul */
  #enviar {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    background: var(--bubble-out); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  #enviar:active { transform: scale(.94); }
  #enviar svg { display: block; }

  /* Diálogo de ayuda */
  dialog { background: var(--bar); color: var(--text); border: 0; border-radius: 18px; width: min(420px, 92vw); padding: 22px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h2 { margin: 0 0 14px; font-size: 18px; }
  dialog a { color: var(--bubble-out); display: block; padding: 10px 0; text-decoration: none; }
  dialog .pais { margin-top: 10px; font-weight: 600; }
  dialog .btn { margin-top: 16px; width: auto; padding: 10px 20px; border-radius: 10px; background: var(--input-bg); font-weight: 600; }
  dialog .aviso { margin: 14px 0 0; font-size: 13px; color: var(--muted); }
  dialog .link { margin-top: 4px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="avatar" aria-hidden="true">L</div>
    <div class="who">
      <h1>Lorena</h1>
      <p id="estado">Activa ahora</p>
    </div>
  </div>
  <button id="ayudaBtn" class="round" type="button" title="Ayuda" aria-label="Ayuda">?</button>
</header>
<main>
  <div id="chat" aria-live="polite"></div>
  <div id="input-area">
    <div class="composer">
      <input id="input" type="text" placeholder="Escribe un mensaje..." autocomplete="off">
      <button id="mic" class="icon-btn" type="button" title="Hablar" style="display:none;" aria-label="Hablar">🎤</button>
    </div>
    <button id="speaker" class="icon-btn" type="button" title="Escuchar último mensaje" style="display:none;" aria-label="Escuchar último mensaje">🔊</button>
    <button id="enviar" type="button" title="Enviar" aria-label="Enviar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
        <path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</main>
<dialog id="ayuda">
  <h2>Si lo necesitas, hay personas que pueden ayudarte</h2>
  <div id="ayudaLista"></div>
  <p class="aviso">Lorena no brinda atención médica ni psicológica. Si estás en crisis o en peligro, contacta una línea de ayuda o los servicios de emergencia.</p>
  <a class="link" href="privacidad.html" target="_blank" rel="noopener">Aviso legal y privacidad</a>
  <button class="btn" id="cerrar" type="button">Cerrar</button>
</dialog>
<script src="contenido.js"></script>
<script src="app.js"></script>
<!-- Para ti, que también mereces un poquito de toda la luz que das. -->
</body>
</html>

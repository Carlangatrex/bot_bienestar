<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f62">
<link rel="manifest" href="manifest.json">
<title>Acompañante</title>
<style>
  :root {
    --bg: #f3f1ec; --bar: #2f6f62; --me: #d7efe6; --bot: #ffffff;
    --text: #1f2a27; --muted: #6b7a75;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111715; --bar: #1f4a41; --me: #25524a; --bot: #1e2623; --text: #e8efec; --muted: #8fa19a; }
  }
  * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--bar); color: #fff; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 12px; opacity: .8; }
  #chat { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 82%; padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--me); align-self: flex-end; border-bottom-right-radius: 4px; }
  .typing { color: var(--muted); font-style: italic; }
  form { display: flex; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--bg); }
  textarea { flex: 1; resize: none; border: 1px solid var(--muted); border-radius: 20px; padding: 10px 14px;
             font: inherit; background: var(--bot); color: var(--text); max-height: 120px; }
  button { border: 0; border-radius: 50%; width: 44px; height: 44px; background: var(--bar); color: #fff; font-size: 20px; }
  button:disabled { opacity: .5; }
  #login { flex: 1; padding: 32px 24px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  #login[hidden] { display: none; }
  #login h2 { margin: 0; }
  #login p { margin: 0; color: var(--muted); }
  #loginForm, #codeForm { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  #loginForm[hidden], #codeForm[hidden] { display: none; }
  #loginForm input, #codeForm input { border: 1px solid var(--muted); border-radius: 12px; padding: 12px 14px; font: inherit;
                     background: var(--bot); color: var(--text); }
  button.wide { width: 100%; border-radius: 12px; font-size: 16px; }
  #loginMsg { min-height: 1.4em; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  button.hbtn { width: auto; height: auto; border-radius: 16px; padding: 7px 14px; font-size: 14px; background: rgba(255,255,255,.2); }
  button.link { width: auto; height: auto; border-radius: 0; background: none; color: var(--text); text-decoration: underline;
                font-size: 15px; padding: 8px 0; text-align: left; display: block; }
  .legal { font-size: 13px; } .legal a, dialog a { color: inherit; }
  dialog { background: var(--bot); color: var(--text); border: 0; border-radius: 16px; width: min(420px, 92vw); padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h2 { margin: 0 0 12px; font-size: 18px; }
  dialog a.tel { display: block; padding: 10px 0; font-size: 16px; }
  dialog .pais { margin-top: 10px; font-weight: 600; }
  dialog button.wide { margin-top: 14px; }
</style>
</head>
<body>
<header><div><h1>Acompañante</h1><p>Aquí puedes desahogarte, sin prisa</p></div><button id="ayudaBtn" class="hbtn" type="button">Ayuda</button></header>
<section id="login" hidden>
  <h2>Bienvenido/a 🙂</h2>
  <p>Escribe el correo con el que te suscribiste y te enviamos un código para entrar.</p>
  <form id="loginForm">
    <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="tucorreo@ejemplo.com" required>
    <button id="loginBtn" type="submit" class="wide">Entrar</button>
  </form>
  <form id="codeForm" hidden>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Código de 6 dígitos" required>
    <button id="codeBtn" type="submit" class="wide">Confirmar</button>
  </form>
  <p id="loginMsg" role="alert"></p>
  <p class="legal">Al entrar aceptas la <a href="privacy.html" target="_blank" rel="noopener">política de privacidad y términos</a>.</p>
</section>
<main id="chat" aria-live="polite"></main>
<form id="form">
  <textarea id="input" rows="1" placeholder="Cuéntame cómo va tu día…"></textarea>
  <button id="send" type="submit" aria-label="Enviar">➤</button>
</form>
<dialog id="ayuda">
  <h2>Si lo necesitas, hay personas que pueden ayudarte</h2>
  <div id="ayudaLista"></div>
  <hr>
  <button class="link" id="borrar" type="button">Borrar mi conversación de este teléfono</button>
  <button class="link" id="salir" type="button">Cerrar sesión</button>
  <a href="privacy.html" target="_blank" rel="noopener">Privacidad y términos</a>
  <button class="wide" id="cerrar" type="button">Cerrar</button>
</dialog>
<script src="app.js"></script>
</body>
</html>
